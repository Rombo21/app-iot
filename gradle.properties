# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# ─── JVM del daemon ──────────────────────────────────────────────────────────
# Memoria ampliada + metaspace generoso para evitar OOM en builds grandes
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options="-Xmx1536m"

# ─── Comportamiento del daemon ─────────────────────────────────────────────
org.gradle.daemon=true

# ─── Configuration Cache DESHABILITADA ────────────────────────────────────
# Evita el error: 'Unable to load class ijMapper...' con Gradle 9+
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn

# ─── Kotlin ───────────────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.incremental=true

# ─── AndroidX ─────────────────────────────────────────────────────────────
android.useAndroidX=true